# Claude Code GitHub Action — RoadShield AI
#
# Manual integration for environments where /install-github-app is unavailable.
# Official documentation: https://code.claude.com/docs/en/github-actions
#
# Before merging, install the official Claude GitHub App for this repository,
# then add CLAUDE_CODE_OAUTH_TOKEN under Settings > Secrets and variables > Actions.
# Never commit an API key or token.
#
# Generate the subscription token on your own machine using: claude setup-token
# Never paste the token into an issue, PR, or chat; save it only as a GitHub Actions secret.
# Only repository owner Alaa2134 can trigger this workflow by mentioning @claude.
# No production deployment or database credentials are provided to the job.

name: Claude Code — RoadShield

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      github.actor == 'Alaa2134' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Claude Code and isolate action marker variables
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          cat > "$RUNNER_TEMP/claude-action-launcher" <<'SH'
          #!/bin/sh
          unset CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION
          exec "$HOME/.local/bin/claude" "$@"
          SH
          chmod 700 "$RUNNER_TEMP/claude-action-launcher"

      # Issue #4 only: safely classify OAuth failures without publishing raw
      # model output, prompts, or credential values to GitHub Actions logs.
      - name: Diagnose OAuth authorization (issue 4 only)
        if: github.event_name == 'issue_comment' && github.event.issue.number == 4
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          timeout 90s "$RUNNER_TEMP/claude-action-launcher" -p 'Reply exactly: ROADSHIELD_AUTH_OK' --output-format json > "$RUNNER_TEMP/claude-auth-probe.json" 2> "$RUNNER_TEMP/claude-auth-probe.err"
          probe_rc=$?
          set -e
          export PROBE_RC="$probe_rc"
          python3 - <<'PY'
          import json, os, pathlib
          t = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = (t / 'claude-auth-probe.json').read_text(errors='replace')
          stderr = (t / 'claude-auth-probe.err').read_text(errors='replace')
          try:
              report = json.loads(raw)
          except (ValueError, TypeError):
              report = {}
          content = str(report.get('result', '')) + ' ' + stderr
          code = os.environ.get('PROBE_RC', '?')
          if code == '0' and report.get('is_error') is False:
              classification = 'AUTH_SUCCESS'
          elif '401' in content or 'authentication_failed' in content or 'Not logged in' in content:
              classification = 'AUTH_401_REJECTED'
          elif '429' in content or 'rate limit' in content.lower():
              classification = 'AUTH_429_RATE_LIMIT'
          elif 'Credit balance is too low' in content:
              classification = 'BILLING_REJECTED'
          elif code == '124':
              classification = 'PROBE_TIMEOUT'
          else:
              classification = 'OTHER_CLI_ERROR'
          print('Claude OAuth probe classification:', classification)
          print('Claude OAuth probe process exit code:', code)
          print('Claude OAuth probe had model response:', report.get('is_error') is False)
          PY
          rm -f "$RUNNER_TEMP/claude-auth-probe.json" "$RUNNER_TEMP/claude-auth-probe.err"

      - name: Ask Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude-action-launcher
