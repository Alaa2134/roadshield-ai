# Claude Code GitHub Action — RoadShield AI
#
# Manual integration for environments where /install-github-app is unavailable.
# Official documentation: https://code.claude.com/docs/en/github-actions
#
# Before merging, install the official Claude GitHub App for this repository,
# then add CLAUDE_CODE_OAUTH_TOKEN under Settings > Secrets and variables > Actions.
# Never commit an API key or token.
#
# Generate the subscription token on your own machine using: claude setup-token
# Never paste the token into an issue, PR, or chat; save it only as a GitHub Actions secret.
# Only repository owner Alaa2134 can trigger this workflow by mentioning @claude.
# No production deployment or database credentials are provided to the job.

name: Claude Code — RoadShield

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      github.actor == 'Alaa2134' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ask Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
